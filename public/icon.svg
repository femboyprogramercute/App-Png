<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle for PWA safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Headphones band -->
  <path d="M128 240 C128 150 180 100 256 100 C332 100 384 150 384 240" fill="none" stroke="#1e1b4b" stroke-width="28" stroke-linecap="round" />
  
  <!-- Cat ears / Antennae -->
  <path d="M170 150 L210 90 L240 145 Z" fill="#ec4899" />
  <path d="M342 150 L302 90 L272 145 Z" fill="#ec4899" />
  <path d="M185 140 L210 105 L230 140 Z" fill="#fbcfe8" />
  <path d="M327 140 L302 105 L282 140 Z" fill="#fbcfe8" />

  <!-- Avatar Face -->
  <ellipse cx="256" cy="270" rx="110" ry="105" fill="url(#avatarGrad)" />
  
  <!-- Hair bangs -->
  <path d="M150 240 C170 190 200 170 256 170 C312 170 342 190 362 240 C340 215 310 205 285 215 C265 220 250 205 235 215 C210 205 180 215 150 240 Z" fill="#312e81" />
  
  <!-- Headphone earcups -->
  <rect x="112" y="215" width="36" height="70" rx="18" fill="#1e1b4b" />
  <rect x="364" y="215" width="36" height="70" rx="18" fill="#1e1b4b" />
  <circle cx="130" cy="250" r="10" fill="#ec4899" />
  <circle cx="382" cy="250" r="10" fill="#ec4899" />

  <!-- Eyes: Sparkling Anime Eyes -->
  <ellipse cx="215" cy="265" rx="16" ry="22" fill="#1e1b4b" />
  <ellipse cx="297" cy="265" rx="16" ry="22" fill="#1e1b4b" />
  <circle cx="211" cy="258" r="7" fill="#ffffff" />
  <circle cx="293" cy="258" r="7" fill="#ffffff" />
  <circle cx="221" cy="272" r="3" fill="#ffffff" />
  <circle cx="303" cy="272" r="3" fill="#ffffff" />

  <!-- Cheeks Blush -->
  <ellipse cx="185" cy="285" rx="14" ry="7" fill="#f43f5e" opacity="0.4" />
  <ellipse cx="327" cy="285" rx="14" ry="7" fill="#f43f5e" opacity="0.4" />

  <!-- Mouth: Open talking happy mouth -->
  <path d="M236 295 Q256 325 276 295 Z" fill="#e11d48" />
  <path d="M244 308 Q256 312 268 308 Q256 324 244 308 Z" fill="#fda4af" />

  <!-- Microphone Boom -->
  <path d="M125 265 Q135 340 220 340" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" />
  <rect x="210" y="330" width="28" height="20" rx="8" fill="#10b981" />
  
  <!-- Audio wave badge / video cut badge -->
  <rect x="136" y="390" width="240" height="60" rx="30" fill="#0f172a" opacity="0.85" />
  <line x1="170" y1="420" x2="170" y2="420" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="195" y1="405" x2="195" y2="435" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="220" y1="398" x2="220" y2="442" stroke="#a855f7" stroke-width="8" stroke-linecap="round" />
  <line x1="245" y1="410" x2="245" y2="430" stroke="#ec4899" stroke-width="8" stroke-linecap="round" />
  <line x1="270" y1="402" x2="270" y2="438" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="295" y1="395" x2="295" y2="445" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <line x1="320" y1="412" x2="320" y2="428" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="342" y1="420" x2="342" y2="420" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
</svg>
